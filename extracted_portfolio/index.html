<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>React Artifact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>

  <body>
    <div id="root"></div>

    <!-- App: bundlovaná React komponenta, vykresluje #root a řídí inertial scroll / parallax -->
    <script type="module" src="js/app.js"></script>

    <!-- Externí odkazy v renderovaném obsahu -> target=_blank, rel=noopener -->
    <script src="js/links.js"></script>

    <!-- GSAP + ScrollTrigger (knihovny pro animations/animations.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Scroll story: scény/fáze v animations/scene-config.json, logika v animations/animations.js -->
    <script src="animations/animations.js"></script>
  </body>

</html>
